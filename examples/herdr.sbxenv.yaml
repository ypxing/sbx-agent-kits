# claude + herdr terminal automation. entrypoint_cmd must be overridden to
# claude-herdr on the agent kit itself, or the herdr mixin installs herdr
# but nothing routes the sandbox through it.
#
#   sbx env run examples/herdr.sbxenv.yaml
#
# Attach or orchestrate afterward with:
#
#   sbx exec -it <sandbox> herdr ...

schemaVersion: "1"
agent: claude-sbx
workspace: .

kits:
  - source: git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/agents/claude
    args:
      entrypoint_cmd: claude-herdr
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/mixins/herdr
