# claude + herdr. The herdr mixin only installs a checksum-pinned herdr
# binary to ~/.local/bin — nothing routes the sandbox through it or wires
# it up automatically. Run it yourself once the sandbox is up:
#
#   sbx env run examples/herdr.sbxenv.yaml
#   sbx exec -it <sandbox> herdr ...

schemaVersion: "1"
agent: claude-sbx
workspace: .

kits:
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/agents/claude
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/mixins/herdr
