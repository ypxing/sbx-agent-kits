schemaVersion: "2"
kind: mixin
name: atlassian-mixin
displayName: Atlassian network access
description: >
  Opt-in network allowlist for Atlassian: the Atlassian Rovo remote MCP
  server and developer docs, plus (once you add it below) Jira/Confluence
  REST on your own tenant. Installs nothing — permissions only.

permissions:
  network:
    allow:
      # Jira/Confluence REST (API-token auth): add your own tenant only —
      # *.atlassian.net would reach any tenant, e.g.:
      # - "your-org.atlassian.net"

      # Atlassian remote MCP server (https://mcp.atlassian.com/v1/sse or
      # /v1/mcp) and its OAuth token endpoint. The server calls Jira/
      # Confluence on its side, so api.atlassian.com isn't needed here.
      # Unlike the tenant above these serve every Atlassian tenant; the
      # interactive login happens in the host browser, not the sandbox.
      - "mcp.atlassian.com"
      - "auth.atlassian.com"

      # developer docs
      - "developer.atlassian.com"
