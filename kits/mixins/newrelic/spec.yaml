schemaVersion: "2"
kind: mixin
name: newrelic-mixin
displayName: New Relic network access
description: >
  Opt-in network allowlist for New Relic: the NerdGraph API, the New Relic
  MCP server and docs, for both the US and EU regions (there is no AU
  region). Installs nothing — permissions only. Kept out of domains-access
  like every third-party product (see its scope note); these
  hosts serve any account, not just your org's.

permissions:
  network:
    allow:
      # US region
      - "api.newrelic.com"
      - "mcp.newrelic.com"
      # EU region
      - "api.eu.newrelic.com"
      - "mcp.eu.newrelic.com"
      - "docs.newrelic.com"
      # Ingest endpoints (collector/log-api/otlp.nr-data.net) deliberately
      # omitted: they accept data for any account's license key. Add them in
      # a project kit only if code under test must ship telemetry.
