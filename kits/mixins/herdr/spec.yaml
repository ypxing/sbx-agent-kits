schemaVersion: "2"
kind: mixin
name: herdr-mixin
displayName: herdr terminal automation
description: >
  Installs a checksum-pinned build of herdr (https://herdr.dev), a terminal
  multiplexer / agent-automation CLI, to ~/.local/bin/herdr. That's all this
  mixin does — no config file, no agent integration hook, no generated
  entrypoint script. Run it yourself inside the sandbox, e.g.
  `sbx exec -it <sandbox> herdr ...`; see https://herdr.dev/docs/ for usage.

args:
  version:
    description: pinned herdr.dev release to install (no leading "v")
    default: "0.9.5"
  # Per-arch sha256 for `version`'s release asset — from
  # https://herdr.dev/latest.json's "releases" map (one entry per past
  # version, same shape as its top-level "assets"/"sha256" keys). The
  # defaults below are for v0.9.5; when bumping `version`, pass both of
  # these as matching --kit-arg overrides too, or the checksum check below
  # will (correctly) fail closed instead of installing an unverified binary.
  sha256_x86_64:
    description: 'expected sha256 of "herdr-linux-x86_64" for `version` (defaults to v0.9.5''s)'
    default: "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d"
  sha256_aarch64:
    description: 'expected sha256 of "herdr-linux-aarch64" for `version` (defaults to v0.9.5''s)'
    default: "17d7536f2da50859523680ef279dffcac8e4a235f4e46fe8da6c2ec44141897c"

setup:
  install:
    - command: |
        set -euo pipefail
        VERSION="${{ kit.args.version }}"
        SHA256_X86_64="${{ kit.args.sha256_x86_64 }}"
        SHA256_AARCH64="${{ kit.args.sha256_aarch64 }}"

        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64)  ASSET="herdr-linux-x86_64";  EXPECTED_SHA256="${SHA256_X86_64}" ;;
          aarch64) ASSET="herdr-linux-aarch64"; EXPECTED_SHA256="${SHA256_AARCH64}" ;;
          *) echo "[herdr-mixin] ERROR: unsupported arch: ${ARCH}" >&2; exit 1 ;;
        esac

        echo "[herdr-mixin] Installing herdr v${VERSION} (${ARCH})"

        TMP="$(mktemp -d)"
        trap 'rm -rf "${TMP}"' EXIT
        URL="https://github.com/herdrdev/herdr/releases/download/v${VERSION}/${ASSET}"
        curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 "${URL}" -o "${TMP}/herdr"

        ACTUAL_SHA256="$(sha256sum "${TMP}/herdr" | awk '{ print $1 }')"
        if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
          echo "[herdr-mixin] ERROR: checksum mismatch for ${ASSET} v${VERSION}" >&2
          echo "  expected: ${EXPECTED_SHA256}" >&2
          echo "  actual:   ${ACTUAL_SHA256}" >&2
          exit 1
        fi

        INSTALL_DIR="${HOME}/.local/bin"
        mkdir -p "${INSTALL_DIR}"
        mv "${TMP}/herdr" "${INSTALL_DIR}/herdr"
        chmod +x "${INSTALL_DIR}/herdr"

        "${INSTALL_DIR}/herdr" --version
      user: "1000"
      description: "Install the checksum-verified herdr binary"

permissions:
  network:
    allow:
      - "github.com"
      - "*.githubusercontent.com"
      # herdr itself calls home to herdr.dev on its own (update/manifest
      # checks, onboarding) once someone actually runs it — this mixin
      # writes no config to turn that off, unlike the auto-wired setup it
      # used to install.
      - "herdr.dev"
