schemaVersion: "2"
kind: mixin
name: agent-packages-mixin
displayName: per-agent extra packages
description: >
  Installs whichever "extra" a detected agent CLI has: for claude, the
  claude-hud statusline plugin (https://github.com/jarrodwatts/claude-hud)
  via `claude plugin`, wiring the installed plugin's dist/index.js into
  ~/.claude/settings.json's statusLine; for pi, a set of npm packages
  (default: pi-web-access, pi-subagents) via `pi install`. MCP support
  isn't one of these extras — pi bundles it as the builtin:mcp extension,
  so no separate package is installed for it (see kits/agents/pi/).
  copilot and codex have no extras defined, so the mixin is a no-op for
  them.

args:
  claude_hud_version:
    description: >
      claude-hud git tag to install (e.g. "v0.10.0"). v0.10.0 needs
      Claude Code v2.1.260 or later.
    default: "v0.10.0"
  claude_hud_sha:
    description: >
      Full commit SHA that claude_hud_version must resolve to (the tag's
      commit, not the annotated tag object). The install fails if the
      cloned marketplace HEAD differs, so a moved tag can't slip through.
      Update together with claude_hud_version after reviewing the diff.
    default: "75683c6de1ac07f6bbef00d739001679dba0740c"
  pi_packages:
    description: >
      space-separated list of exact-version npm specs (name@version) to
      `pi install`. Update only after reviewing the new release.
    default: "pi-web-access@0.37.0 pi-subagents@0.76.1"

setup:
  install:
    - command: |
        set -euo pipefail

        # `sbx env run`'s summary only shows a truncated command preview
        # and exit code, so every failure below exits with its own code +
        # a labelled stderr line (same convention kits/agents/claude/
        # spec.yaml uses) — that's enough to tell which check failed
        # without re-running with extra logging.
        die() { echo "[agent-packages-mixin] ERROR($1): $2" >&2; exit "$1"; }

        AGENT=""
        for candidate in claude codex copilot pi; do
          if command -v "${candidate}" >/dev/null 2>&1; then
            AGENT="${candidate}"
            break
          fi
        done
        [ -n "${AGENT}" ] \
          || die 20 "no supported agent CLI (claude|codex|copilot|pi) found on PATH"

        # sync_marketplace_plugin <name> <git-url> <ref>
        #
        # Converges a claude plugin marketplace + its same-named plugin to
        # the given git ref, without erroring on a pre-existing
        # registration the way a bare `add` would (it has no
        # force/overwrite flag). `list --json` isn't a reliable check for
        # "is anything already there" — it can come back empty for a
        # project/local-scope registration that still makes `add` reject
        # with "network source differs" — so removal before add is
        # unconditional and best-effort whenever url+ref don't already
        # match exactly, rather than gated on what list showed.
        #
        # To install another claude marketplace plugin, add another call
        # to this function inside the `claude)` case arm below. Anything
        # beyond marketplace+plugin install — e.g. claude-hud's
        # statusLine/config.json wiring — is specific to that plugin and
        # goes after its own call, following the same pattern.
        sync_marketplace_plugin() {
          name="$1" url="$2" ref="$3"
          current_ref="$(claude plugin marketplace list --json \
            | jq -r --arg n "${name}" --arg u "${url}" \
              '.[] | select(.name == $n and .url == $u) | .ref // ""')" \
            || die 21 "claude plugin marketplace list/jq failed for ${name}"
          if [ "${current_ref}" != "${ref}" ]; then
            echo "[agent-packages-mixin] converging ${name} marketplace to ${ref} (was: ${current_ref:-<none>})"
            claude plugin marketplace remove "${name}" || true
            claude plugin marketplace add "${url}#${ref}" \
              || die 22 "claude plugin marketplace add ${name} failed"
          fi
          echo "[agent-packages-mixin] installing ${name} plugin"
          claude plugin install "${name}@${name}" -y \
            || die 23 "claude plugin install ${name} failed"
        }

        case "${AGENT}" in
          claude)
            # Isolate from a possibly bind-mounted host ~/.gitconfig, but
            # still mark every directory safe: CLAUDE_CONFIG_DIR may itself
            # be bind-mounted from the host (see additionalWorkspaces in
            # the sandbox env config), so any existing .git dirs under it
            # are owned by a different uid than this container's, which
            # git otherwise refuses to touch ("detected dubious ownership").
            GIT_CONFIG_GLOBAL="$(mktemp)"
            git config --file "${GIT_CONFIG_GLOBAL}" --add safe.directory '*'
            export GIT_CONFIG_GLOBAL

            # claude itself resolves its config tree via CLAUDE_CONFIG_DIR,
            # falling back to ~/.claude — match that here so this mixin
            # writes to wherever claude is actually reading from.
            CLAUDE_HOME="${CLAUDE_CONFIG_DIR:-${HOME}/.claude}"

            sync_marketplace_plugin claude-hud \
              "https://github.com/jarrodwatts/claude-hud.git" \
              "${{ kit.args.claude_hud_version }}"

            # The tag is mutable; the commit it resolves to must match the
            # reviewed SHA. sync_marketplace_plugin leaves the marketplace
            # checkout at ${CLAUDE_HOME}/plugins/marketplaces/<name>.
            HUD_SHA="$(git -C "${CLAUDE_HOME}/plugins/marketplaces/claude-hud" rev-parse HEAD)" \
              || die 32 "couldn't read claude-hud marketplace HEAD"
            [ "${HUD_SHA}" = "${{ kit.args.claude_hud_sha }}" ] \
              || die 33 "claude-hud ${{ kit.args.claude_hud_version }} resolved to ${HUD_SHA}, expected ${{ kit.args.claude_hud_sha }}"

            # claude-hud-specific: wire its installed dist/index.js into
            # settings.json's statusLine, and write its own config.json.
            CACHE_ROOT="${CLAUDE_HOME}/plugins/cache/claude-hud/claude-hud"
            INSTALLED_DIR=$(find "${CACHE_ROOT}" -mindepth 1 -maxdepth 1 -type d | head -1)
            [ -n "${INSTALLED_DIR}" ] && [ -f "${INSTALLED_DIR}/dist/index.js" ] \
              || die 24 "couldn't find dist/index.js under ${CACHE_ROOT}"

            SETTINGS="${CLAUDE_HOME}/settings.json"
            mkdir -p "$(dirname "${SETTINGS}")"
            [ -f "${SETTINGS}" ] || echo '{}' > "${SETTINGS}"
            STATUSLINE_CMD="cols=\$(stty size </dev/tty 2>/dev/null | awk '{print \$2}'); export COLUMNS=\$(( \${cols:-120} > 4 ? \${cols:-120} - 4 : 1 )); exec node \"${INSTALLED_DIR}/dist/index.js\""
            jq --arg cmd "${STATUSLINE_CMD}" '.statusLine = {"type": "command", "command": $cmd}' \
              "${SETTINGS}" > "${SETTINGS}.tmp" && mv "${SETTINGS}.tmp" "${SETTINGS}" \
              || die 25 "failed writing statusLine to ${SETTINGS}"

            HUD_CONFIG_DIR="${CLAUDE_HOME}/plugins/claude-hud"
            mkdir -p "${HUD_CONFIG_DIR}"
            jq -n '{
              language: "en",
              lineLayout: "expanded",
              showSeparators: false,
              gitStatus: {
                enabled: true,
                showDirty: true,
                showAheadBehind: true,
                showFileStats: false
              },
              display: {
                showModel: true,
                showContextBar: true,
                showTools: true,
                showAgents: true,
                showTodos: true,
                showProject: true,
                showConfigCounts: true,
                showTokenBreakdown: true,
                showSpeed: true,
                showUsage: true,
                showDuration: true,
                showSessionName: true,
                showSessionTokens: true,
                usageBarEnabled: true
              }
            }' > "${HUD_CONFIG_DIR}/config.json" \
              || die 26 "failed writing ${HUD_CONFIG_DIR}/config.json"
            ;;

          pi)
            for pkg in ${{ kit.args.pi_packages }}; do
              case "${pkg}" in
                *@[0-9]*) ;;
                *) die 34 "pi package '${pkg}' is not pinned to an exact version (name@x.y.z)" ;;
              esac
              echo "[agent-packages-mixin] pi install npm:${pkg}"
              pi install "npm:${pkg}"
            done
            ;;

          *)
            echo "[agent-packages-mixin] no extras defined for ${AGENT}, skipping"
            ;;
        esac
      user: "1000"
      description: "Install per-agent extras (claude-hud for claude, npm packages for pi)"

permissions:
  network:
    allow:
      # claude-hud marketplace add clones from github.com; this repo's e2e
      # runs every kit under `sbx policy init deny-all`, so this must be
      # listed even though nothing here injects credentials into it.
      - "github.com"
      - "*.githubusercontent.com"
      # pi install pulls packages from the npm registry.
      - "registry.npmjs.org"
