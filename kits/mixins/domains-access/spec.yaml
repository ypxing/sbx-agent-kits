schemaVersion: "2"
kind: mixin
name: domains-access-mixin
displayName: developer network allowlist
description: >
  Adds a standalone network allowlist for common developer domains:
  AWS/Bedrock, GitHub (incl. github.io pages, where many
  projects deploy OpenAPI/API docs), npm/yarn/pnpm and Node downloads,
  Python/Go/Rust/JVM/Terraform package registries, container registries,
  common language/platform docs, and the hosted docs sites for
  claude/copilot/codex/cursor. Installs nothing — permissions only. Carries its own
  copy of AWS/GitHub domains too, so it works even when composed without the
  aws/herdr/dotfiles mixins that also grant them.

  Scope: general developer infrastructure every repo needs (registries,
  toolchains, language docs), naming no organisation. An organisation's
  own domains, vendor tenants and the third-party products it uses
  (Atlassian, Figma, Slack, New Relic, ...) go in that organisation's
  mixin instead, e.g. example-org/.

permissions:
  network:
    allow:
      # AWS / Bedrock
      - "*.amazonaws.com"
      - "*.awsapps.com"

      # Serverless Framework
      - "*.serverless.com"

      # GitHub (repos, releases, raw content, github.io pages e.g. OpenAPI docs)
      - "github.com"
      - "*.githubusercontent.com"
      - "*.github.io"

      # npm / yarn / pnpm
      - "registry.npmjs.org"
      - "www.npmjs.com"
      - "registry.yarnpkg.com"
      - "*.pnpm.io"

      # Node.js downloads (nvm / toolchain installs)
      - "nodejs.org"

      # Python
      - "pypi.org"
      - "files.pythonhosted.org"

      # Go: module proxy + checksum DB (go mod fails verification without
      # sum.golang.org), govulncheck DB, docs, and toolchain downloads
      # (go.dev/dl redirects to dl.google.com).
      - "proxy.golang.org"
      - "sum.golang.org"
      - "vuln.go.dev"
      - "pkg.go.dev"
      - "go.dev"
      - "golang.org"
      - "dl.google.com"

      # Java / JVM: Maven Central + Gradle plugin portal/distributions (the
      # portal redirects plugin JAR downloads to plugins-artifacts)
      - "repo.maven.apache.org"
      - "repo1.maven.org"
      - "plugins.gradle.org"
      - "plugins-artifacts.gradle.org"
      - "services.gradle.org"

      # Terraform: provider/module registry (+ provider docs) and binaries.
      # app.terraform.io (HCP Terraform) deliberately omitted: it accepts
      # state uploads to any org.
      - "registry.terraform.io"
      - "releases.hashicorp.com"

      # Rust
      - "crates.io"
      - "static.crates.io"

      # container registries
      - "docker.io"
      - "registry-1.docker.io"
      - "auth.docker.io"
      - "production.cloudflare.docker.com"
      - "ghcr.io"

      # agent CLI docs
      - "docs.claude.com"
      - "docs.github.com"
      - "platform.openai.com"
      - "cursor.com" # cursor.com/docs

      # AWS docs
      - "docs.aws.amazon.com"
      - "aws.amazon.com"

      # language / platform docs agents look things up in
      - "developer.mozilla.org"
      - "www.typescriptlang.org"
