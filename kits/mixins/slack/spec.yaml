schemaVersion: "2"
kind: mixin
name: slack-mixin
displayName: Slack network access
description: >
  Opt-in network allowlist for Slack: the Web API and file downloads, plus
  (once you add it below) your own workspace. Installs nothing — permissions only. Kept out of
  domains-access like every third-party product (see its scope note); these
  hosts serve any account, not just your org's.

permissions:
  network:
    allow:
      # Web API (slack.com/api/*). If agents use Slack's remote MCP server,
      # confirm its host with `sbx policy log` and add it here.
      - "slack.com"
      # your workspace, e.g.:
      # - "your-org.slack.com"
      - "files.slack.com"
      # hooks.slack.com deliberately omitted: anyone's incoming-webhook URL
      # works without auth, making it a one-request exfil path.
