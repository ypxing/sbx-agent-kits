schemaVersion: "2"
kind: sandbox
name: codex-sbx
displayName: OpenAI Codex
description: OpenAI Codex CLI agent.

args:
  image:
    description: "Full image reference, e.g. my.registry.io/my-base:latest"
    default: "docker/sandbox-templates:shell-docker"
  host_persist_dir:
    description: >
      Optional host directory (mounted separately, e.g. via
      additionalWorkspaces) to persist Codex session/memory state across
      sandbox recreation: thread_history_1.sqlite (transcripts),
      memories_1.sqlite + memories_v2_1.sqlite (memory), queue_1.sqlite
      (durable undelivered-message queue), goals_1.sqlite (per-thread
      goals), state_5.sqlite (the thread index `codex resume`'s picker
      reads — also carries device_key_bindings/remote_control_enrollments,
      which persist too since they're not separable from the index), and
      history.jsonl (cross-session prompt input history, i.e. up-arrow
      recall in the interactive TUI). Everything else in $CODEX_HOME
      (config.toml, auth.json, skills, logs_2.sqlite) stays sandbox-local.
      Leave unset for a fully ephemeral sandbox.
    default: ""
  awsAuthRefresh:
    description: >
      Unused by this kit — declared as a no-op so callers that switch
      between agent kits (e.g. sbxenv.yaml's env.args.agent) can pass the
      same arg regardless of which agent is selected. Only kits/agents/
      claude/ actually applies it.
    default: ""

sandbox:
  image: "${{ kit.args.image }}"
  entrypoint: ["codex"]

environment:
  variables:
    CODEX_HOME: /home/agent/.codex
    BROWSER: xdg-open
    # Never let git block on an interactive credential prompt — that would
    # freeze the Codex TUI. Fail fast instead.
    GIT_TERMINAL_PROMPT: "0"

setup:
  install:
    - command: |
        set -euo pipefail

        # Installs the latest published Codex CLI at sandbox-creation time
        # (rather than baking a pinned version into a custom image), so
        # every sandbox always runs whatever's newest on npm. Base config +
        # guardrail hooks are bundled as static files under
        # files/home/.codex/ (see the kit spec reference's "Static files"
        # section) and already land in place before this step runs.
        npm install -g @openai/codex

        # Belt-and-suspenders: the kit spec reference doesn't explicitly
        # promise the hooks' executable bit survives the files/home/ copy.
        chmod +x "${CODEX_HOME}/hooks/"*.sh
      user: "1000"
      description: "Install Codex CLI"

    - command: |
        set -euo pipefail

        # Codex stores session/memory data as versioned sqlite files
        # directly in $CODEX_HOME (no dedicated subdirectory like Claude's
        # projects/), per codex-rs/state/src/sqlite.rs's RUNTIME_DBS list —
        # thread_history_1.sqlite holds session/resume transcripts,
        # memories_1.sqlite + memories_v2_1.sqlite hold memory (same
        # DbKind::Memories store, two generations coexisting mid-migration),
        # queue_1.sqlite is the durable user-message queue (messages queued
        # for a thread that haven't been delivered yet), goals_1.sqlite
        # backs the per-thread "ThreadGoal" feature, and state_5.sqlite is
        # the thread index (threads/projects/goals/jobs tables) that `codex
        # resume`'s picker actually reads; without it, resume won't list
        # old threads even though their transcript content is preserved.
        # state_5.sqlite also carries device_key_bindings and
        # remote_control_enrollments (device-pairing state, not API
        # credentials) — not separable from the index, so they persist too.
        # history.jsonl (unversioned, no _N suffix) holds cross-session
        # prompt input history for the interactive TUI's up-arrow recall.
        # logs_2.sqlite (DbKind::Logs) is intentionally excluded — it's
        # telemetry/error logs, not resumable state.
        #
        # The _N suffix on each sqlite filename is a per-store
        # schema-migration generation number, versioned independently — if
        # a future codex release migrates one of these to a new
        # generation, this list needs the new filename added; until then,
        # persistence for that store just silently stops (codex keeps
        # working fine against a fresh, unlinked file).
        #
        # -wal/-shm sqlite companion files are intentionally not symlinked:
        # sqlite computes their path by string-suffixing the path it was
        # opened with, not by re-resolving the symlink, so they always land
        # sandbox-local regardless. That only risks losing the last
        # not-yet-checkpointed turns on teardown — normal sqlite
        # unclean-shutdown tolerance, not corruption.
        HOST_PERSIST_DIR="${{ kit.args.host_persist_dir }}"
        if [ -n "${HOST_PERSIST_DIR}" ]; then
          if [ ! -d "${HOST_PERSIST_DIR}" ]; then
            echo "[codex-sbx] ERROR(20): host_persist_dir=${HOST_PERSIST_DIR} does not exist (mount missing?)" >&2
            exit 20
          fi
          mkdir -p "${CODEX_HOME}"
          for rel in thread_history_1.sqlite memories_1.sqlite memories_v2_1.sqlite queue_1.sqlite goals_1.sqlite state_5.sqlite history.jsonl; do
            src="${HOST_PERSIST_DIR}/${rel}"
            dest="${CODEX_HOME}/${rel}"
            touch "${src}"
            if [ -e "${dest}" ] && [ ! -L "${dest}" ]; then
              echo "[codex-sbx] moving ${dest} aside to ${dest}.orig"
              mv "${dest}" "${dest}.orig"
            fi
            if [ ! -L "${dest}" ]; then
              echo "[codex-sbx] linking ${dest} -> ${src}"
              ln -s "${src}" "${dest}"
            fi
          done
        fi
      user: "1000"
      description: "Link persistent session/memory sqlite files and command history (if mounted)"

permissions:
  network:
    allow:
      # npm install -g @openai/codex, above.
      - registry.npmjs.org
