schemaVersion: "1"
agent: ${{ env.args.agent }}-sbx
workspace: ${{ env.args.workspace }}

args:
  workspace:
    default: .
    description: primary workspace
  agent:
    default: claude
    description: coding agent
    enum:
      - claude
      - codex
      - pi
      - copilot

kits:
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/agents/${{ env.args.agent }}
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/mixins/aws
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/mixins/herdr
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/mixins/coding-crew
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/mixins/npm-auth
  - git+https://github.com/ypxing/sbx-agent-kits.git#dir=kits/mixins/agent-packages

additionalWorkspaces:
  # avoid updates to the sbx-env folder from the sandbox
  - path: ./sbxenv.yaml
    readOnly: true

sandboxOptions:
  memory: 8g

env:
  # sandbox
  IS_SANDBOX: "1"
  SBX_NO_TELEMETRY: "1"

  CLAUDE_CODE_USE_BEDROCK: "1"
  ANTHROPIC_DEFAULT_SONNET_MODEL: au.anthropic.claude-sonnet-5
  ANTHROPIC_DEFAULT_OPUS_MODEL: au.anthropic.claude-opus-5
  ANTHROPIC_DEFAULT_HAIKU_MODEL: au.anthropic.claude-haiku-4-5-20251001-v1:0

  # aws
  AWS_BEDROCK_FORCE_CACHE: "1"
