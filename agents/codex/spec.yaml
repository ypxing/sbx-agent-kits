schemaVersion: "2"
kind: sandbox
name: codex-sbx
displayName: OpenAI Codex
description: OpenAI Codex CLI agent.

# Image resolved by scripts/gen-specs.sh — set SBX_IMAGE_REGISTRY or
# SBX_CODEX_IMAGE before running it to use your own image.
sandbox:
  image: "docker/sandbox-templates:codex-docker"
  # codex-herdr (scripts/herdr-entrypoint.sh, installed under this
  # agent-specific name) boots a headless herdr server and starts codex in a
  # managed pane (as `main`) rather than exec'ing codex directly.
  # Attach/orchestrate afterward with `sbx exec -it <name> herdr ...`
  # against the same running server.
  entrypoint: [codex-herdr]

setup:
  install:
    - command: |
        echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > $HOME/.npmrc
        echo '//registry.yarnpkg.com/:_authToken=${NPM_TOKEN}' >> $HOME/.npmrc
      user: "1000"
      description: "Write npm registry auth tokens to $HOME/.npmrc"
  startup:
    - command: ["sh", "-c", "command -v aws >/dev/null 2>&1 && aws sso login || true"]
      user: "1000"
      description: "AWS SSO from host"

environment:
  variables:
    # sandbox
    IS_SANDBOX: "1"
    SBX_NO_TELEMETRY: "1"

    # aws
    AWS_PROFILE: "sso-live"
    AWS_BEDROCK_FORCE_CACHE: "1"

    CODEX_HOME: /home/agent/.codex
    BROWSER: xdg-open
    # Never let git block on an interactive credential prompt — that would
    # freeze the Codex TUI. Fail fast instead.
    GIT_TERMINAL_PROMPT: "0"
